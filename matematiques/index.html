<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Matemàtiques · MADUKA LAB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f5;
      color: #1d1d1f;
      line-height: 1.5;
    }

    /* CAPÇALERA */

    header {
      max-width: 1200px;
      margin: auto;
      padding: 35px 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      text-decoration: none;
      color: #1d1d1f;
    }

    .tornar {
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    .tornar:hover {
      color: #000;
    }


    /* PRESENTACIÓ */

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 100px 30px 90px;
    }

    .hero h1 {
      font-size: clamp(52px, 8vw, 100px);
      line-height: 0.95;
      letter-spacing: -5px;
    }

    .hero p {
      margin-top: 35px;
      font-size: 21px;
      color: #666;
      max-width: 650px;
    }


    /* RECURSOS */

    .recursos {
      max-width: 1200px;
      margin: auto;
      padding: 40px 30px 100px;
    }

    .recursos h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
      color: #777;
    }


    /* GRAELLA */

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }


    /* TARGETES */

    .card {
      background: white;
      border-radius: 18px;
      padding: 35px;
      min-height: 260px;

      text-decoration: none;
      color: inherit;

      display: flex;
      flex-direction: column;
      justify-content: space-between;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    }


    /* PART SUPERIOR TARGETA */

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .icon {
      font-size: 38px;
    }

    .etiqueta {
      background: #f1f1ef;
      padding: 6px 10px;
      border-radius: 20px;

      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #666;
    }


    /* TEXT TARGETA */

    .card h3 {
      font-size: 25px;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .card p {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }

    .obrir {
      margin-top: 20px;
      font-size: 13px;
      font-weight: 600;
      color: #1d1d1f;
    }


    /* PEU */

    footer {
      max-width: 1200px;
      margin: auto;
      padding: 40px 30px;

      border-top: 1px solid #ddd;

      color: #888;
      font-size: 13px;
    }


    /* MÒBIL */

    @media (max-width: 800px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 60px;
      }

      .hero h1 {
        letter-spacing: -3px;
      }
    }

  </style>

</head>


<body>


<header>

  <a class="logo" href="../">
    MADUKA LAB
  </a>

  <a class="tornar" href="../">
    ← Inici
  </a>

</header>



<main>


  <!-- PRESENTACIÓ -->

  <section class="hero">

    <h1>
      Matemàtiques.
    </h1>

    <p>
      Jocs, simuladors i activitats interactives
      per experimentar amb les matemàtiques.
    </p>

  </section>



  <!-- RECURSOS -->

  <section class="recursos">

    <h2>Recursos</h2>


    <div class="grid">


      <!-- JOC DE LES FITXES -->

      <a
        class="card"
        href="https://jocdelesfitxes.netlify.app/"
        target="_blank"
        rel="noopener noreferrer"
      >

        <div class="card-top">

          <div class="icon">
            🔴🔵
          </div>

          <div class="etiqueta">
            MADUKA LAB
          </div>

        </div>


        <div>

          <h3>
            El joc de les fitxes
          </h3>

          <p>
            Experimenta amb l'atzar utilitzant
            fitxes vermelles i blaves.
          </p>

          <div class="obrir">
            Obrir recurs ↗
          </div>

        </div>

      </a>


    </div>

  </section>


</main>



<footer>
  MADUKA LAB · Recursos educatius oberts
</footer>


</body>

</html>
