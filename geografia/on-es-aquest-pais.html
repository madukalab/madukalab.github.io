<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On és aquest país? · MADUKA</title>
  <link rel="icon" href="../favicon.png?v=2">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: #081421;
      color: #f2f7fb;
      font: 16px/1.5 system-ui, sans-serif;
    }

    main { max-width: 1320px; margin: auto; padding: 20px clamp(12px, 3vw, 36px) 28px; }

    header, .round, .controls, .stats {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 18px;
    }

    header, .round { justify-content: space-between; }
    header { margin-bottom: 18px; }
    header a { color: #bfd6e9; text-decoration: none; }
    .brand { color: white; font-weight: 850; }
    h1 { margin: 0 0 14px; font-size: clamp(25px, 4vw, 42px); }
    h2 { margin: 0; font-size: clamp(20px, 4vw, 32px); line-height: 1.15; }
    h2 strong, #score { color: #72f0be; }

    .game {
      overflow: hidden;
      border: 1px solid #304a60;
      border-radius: 20px;
      background: #101f30;
    }

    .round, .controls { padding: 12px 16px; }
    #level { margin: 0 0 5px; color: #b3d6f2; font-size: .85rem; font-weight: 700; }
    #counter { color: #bed0df; font-size: .9rem; }

    #streak {
      padding: 3px 9px;
      border-radius: 999px;
      background: #68471f;
      color: #fff1af;
      font-size: .85rem;
      font-weight: 800;
    }

    #progress { display: flex; gap: 5px; padding: 0 16px 10px; }
    #progress span { flex: 1; height: 5px; border-radius: 6px; background: #30455a; }
    #progress .current { background: #91c8f3; }
    #progress .hit { background: #36e8a5; }
    #progress .miss { background: #ff8d80; }

    .map-frame { position: relative; isolation: isolate; }

    #map {
      height: clamp(320px, 58vh, 690px);
      background: radial-gradient(ellipse at 50% 38%, #1b4c69, #112f49 72%);
      border-block: 1px solid #304a60;
    }

    path.leaflet-interactive { transition: fill .14s ease, stroke .14s ease; }
    .leaflet-container .leaflet-control-attribution { background: #101f30; color: #d0e1ed; }
    .leaflet-control-attribution a { color: #9dd8ff; }
    #feedback { flex: 1 1 250px; margin: 0; color: #d4e4ef; }

    button {
      min-height: 42px;
      padding: 8px 14px;
      border: 1px solid #46637a;
      border-radius: 10px;
      background: #1c3349;
      color: #f4f9fc;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.15); }
    .primary { background: #72f0be; color: #08251d; border-color: #72f0be; }
    :focus-visible { outline: 3px solid #a6e0ff; outline-offset: 3px; }

    dialog {
      width: min(440px, calc(100% - 32px));
      padding: clamp(24px, 7vw, 44px);
      border: 1px solid #53768d;
      border-radius: 24px;
      background: radial-gradient(ellipse at top, #203d52, #101f30 72%);
      color: #f2f7fb;
      text-align: center;
      box-shadow: 0 24px 80px #0009;
    }

    dialog[open] { animation: dialog-in .24s ease-out both; }
    dialog::backdrop { background: #040b15b8; backdrop-filter: blur(4px); }
    #intro-title { font-size: clamp(32px, 8vw, 50px); letter-spacing: -.045em; }
    #intro-info { margin: 12px 0 24px; color: #c5ddeb; }
    #start-round { min-width: 145px; }

    .pin {
      position: relative;
      display: block;
      width: 28px;
      height: 34px;
      transform-origin: 14px 32px;
      filter: drop-shadow(2px 3px 2px #001827aa);
    }

    .pin::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 10px;
      width: 4px;
      height: 22px;
      background: linear-gradient(90deg, #56636e, #f5fbff 55%, #9ca9b2);
      clip-path: polygon(0 0, 100% 0, 100% 84%, 50% 100%, 0 84%);
    }

    .pin::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 4px;
      width: 20px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%, #fff4db, #ff987c 23%, #ed4637 54%, #a21924);
      box-shadow: inset 0 -2px 2px #66141e70;
    }

    .pin-land { animation: land .52s ease-out both; }
    .pin-slip { animation: slip .7s ease-in-out both; }

    .points {
      display: block;
      color: #e3fff2;
      font: 900 24px/1 system-ui, sans-serif;
      text-align: center;
      text-shadow: 0 2px 7px #001e17, 0 0 12px #08744c;
      animation: float-up 1.15s .33s ease-out both;
    }

    #confetti { position: absolute; z-index: 450; inset: 0; overflow: hidden; pointer-events: none; }

    #confetti i {
      position: absolute;
      top: -18px;
      width: 9px;
      height: 15px;
      border-radius: 2px;
      animation: fall var(--time) var(--delay) ease-in both;
    }

    @keyframes dialog-in {
      from { opacity: 0; transform: translateY(12px) scale(.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes land {
      0% { transform: translateY(-44px) rotate(-14deg); opacity: 0; }
      64% { transform: translateY(0); opacity: 1; }
      80% { transform: translateY(-5px); }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes slip {
      0% { transform: translateY(-44px) rotate(-14deg); opacity: 0; }
      42% { transform: translateY(0); opacity: 1; }
      68% { transform: translate(8px, -7px) rotate(65deg); opacity: 1; }
      100% { transform: translate(28px, 80px) rotate(145deg); opacity: 0; }
    }

    @keyframes float-up {
      0% { transform: scale(.75); opacity: 0; }
      20%, 70% { opacity: 1; }
      100% { transform: translateY(-55px) scale(1.12); opacity: 0; }
    }

    @keyframes fall {
      to { transform: translate(var(--drift), 75vh) rotate(640deg); opacity: .2; }
    }

    @media (prefers-reduced-motion: reduce) {
      dialog[open], .pin, .points, #confetti i { animation: none; }
      path.leaflet-interactive { transition: none; }
    }
    .ranking { margin-top: 20px; padding: 18px; }
    .ranking h2 { margin-bottom: 14px; }
    .ranking form { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .ranking input { min-height: 42px; max-width: 100%; padding: 8px 12px; border: 1px solid #53768d; border-radius: 8px; background: #081421; color: inherit; font: inherit; }
    .ranking table { width: 100%; border-collapse: collapse; }
    .ranking th, .ranking td { padding: 8px; border-bottom: 1px solid #304a60; text-align: left; }
    .ranking th:last-child, .ranking td:last-child { text-align: right; }
    .ranking td { overflow-wrap: anywhere; }
    .ranking tbody tr:nth-child(-n+3) { color: #72f0be; }
    .ranking button:disabled { opacity: .55; cursor: default; }
  </style>
</head>

<body>
  <main>
    <header>
      <a class="brand" href="../">MADUKA</a>
      <a href="./">← Geografia</a>
    </header>

    <h1>On és aquest país?</h1>

    <section class="game" aria-label="Joc del mapamundi">
      <div class="round">
        <div>
          <p id="level"></p>
          <h2 id="question" tabindex="-1" aria-live="polite">Preparant el mapa…</h2>
        </div>
        <div class="stats">
          <span id="counter"></span>
          <strong id="score"></strong>
          <span id="streak" hidden></span>
        </div>
      </div>

      <div id="progress" aria-hidden="true"></div>

      <div class="map-frame">
        <div id="map" role="region" aria-label="Mapamundi interactiu"></div>
        <div id="confetti" aria-hidden="true"></div>
      </div>

      <div class="controls">
        <p id="feedback" role="status">Carregant les fronteres dels països…</p>
        <button id="world" type="button" hidden>Vista del món</button>
        <button id="skip" type="button" hidden>Passa</button>
        <button id="review" type="button" hidden>Repassem els errors</button>
        <button id="continue" class="primary" type="button" hidden>Ronda següent</button>
      </div>
    </section>
    <section class="game ranking" aria-labelledby="ranking-title">
      <h2 id="ranking-title">Classificació</h2>
      <form id="ranking-form" hidden>
        <label for="ranking-alias">Àlies</label>
        <input id="ranking-alias" name="alias" required maxlength="24" minlength="2" autocomplete="off" placeholder="El teu àlies de joc">
        <button id="ranking-save" type="submit" class="primary">Registra la puntuació</button>
      </form>
      <p id="ranking-status" role="status"></p>
      <table aria-labelledby="ranking-title">
        <thead>
          <tr><th scope="col">Àlies</th><th scope="col">Punts</th></tr>
        </thead>
        <tbody id="ranking-rows"></tbody>
      </table>
    </section>
  </main>

  <dialog id="round-intro" aria-labelledby="intro-title" aria-describedby="intro-info">
    <h2 id="intro-title"></h2>
    <p id="intro-info"></p>
    <button id="start-round" type="button" class="primary" autofocus>Comença</button>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const mapUrl = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson";
    const questionsPerRound = 10;
    const hitDelay = 1500;
    const correctionDelay = 2400;
    const fallingPinDelay = 700;

    const levels = [
      { name: "Fàcil", codes: "CA US BR RU CN IN AU MX AR ES FR GB JP DE EG IT" },
      { name: "Mitjana", codes: "PT NO SE FI PL GR TR MA DZ ZA PE CO CL ID SA NZ TH UA" },
      { name: "Difícil", codes: "IE RO BG HU AT CH BE NL DK CZ SK CU VN KR LK NP EC UY TN JO" },
      { name: "Experta", codes: "ME XK SI AL MK MD BA EE LV LT LU BN BT TL QA KW GQ GM SV" }
    ];

    const question = document.getElementById("question");
    const levelLabel = document.getElementById("level");
    const counter = document.getElementById("counter");
    const score = document.getElementById("score");
    const streakBadge = document.getElementById("streak");
    const progress = document.getElementById("progress");
    const feedback = document.getElementById("feedback");
    const world = document.getElementById("world");
    const skip = document.getElementById("skip");
    const review = document.getElementById("review");
    const continueButton = document.getElementById("continue");
    const confetti = document.getElementById("confetti");
    const intro = document.getElementById("round-intro");
    const introTitle = document.getElementById("intro-title");
    const introInfo = document.getElementById("intro-info");
    const startRoundButton = document.getElementById("start-round");

    const regionNames = new Intl.DisplayNames(["ca"], { type: "region" });
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const layers = new Map();

    const land = { color: "#52766f", weight: .8, fillColor: "#c8dbbc", fillOpacity: 1 };
    const hover = { color: "#f6bb4c", weight: 1.4, fillColor: "#ffdf83" };
    const correct = { color: "#e5fff3", weight: 2, fillColor: "#31eba4" };
    const wrong = { color: "#ffe1db", weight: 1.8, fillColor: "#ff897a" };

    let map, countries, pins, effects;
    let selections = [];
    let levelIndex = 0;
    let questions = [];
    let questionIndex = 0;
    let results = [];
    let roundStart = 0;
    let streak = 0;
    let phase = "loading";
    let reviewing = false;
    let answerTimer;
    let confettiTimer;


    // Enganxa aquí l’URL /exec d’Apps Script per compartir la classificació.
    const rankingUrl = "https://script.google.com/macros/s/AKfycbw6sKEsJFZOzbjstD4DHZZ9VuukKh3CR91JTK8F_DQPvPk7_W1WHz5xj3ZtxoDlyvc/exec";
    const rankingStorageKey = "maduka-geografia-ranking-v1";
    const rankingForm = document.getElementById("ranking-form");
    const rankingAlias = document.getElementById("ranking-alias");
    const rankingSave = document.getElementById("ranking-save");
    const rankingStatus = document.getElementById("ranking-status");
    const rankingRows = document.getElementById("ranking-rows");
    let pendingScore = null;
    let rankingBusy = false;

    function renderRanking(entries) {
      rankingRows.replaceChildren(...entries.slice(0, 20).map(entry => {
        const row = document.createElement("tr");
        for (const value of [entry.alias, entry.points]) {
          row.insertCell().textContent = value;
        }
        return row;
      }));
    }

    function localRanking() {
      try {
        const entries = JSON.parse(localStorage.getItem(rankingStorageKey) || "[]");
        return Array.isArray(entries) ? entries : [];
      } catch {
        return [];
      }
    }

    function localScore(entry) {
      const entries = localRanking();
      const key = entry.alias.toLocaleLowerCase("ca");
      const previous = entries.find(item => item.alias.toLocaleLowerCase("ca") === key);
      if (!previous || entry.points > previous.points) {
        if (previous) Object.assign(previous, entry);
        else entries.push(entry);
      }
      entries.sort((a, b) => b.points - a.points || a.alias.localeCompare(b.alias, "ca"));
      localStorage.setItem(rankingStorageKey, JSON.stringify(entries));
      return entries;
    }

    async function getRanking(entry) {
      if (!rankingUrl) return entry ? localScore(entry) : localRanking();
      const options = entry ? {
        method: "POST",
        body: new URLSearchParams({ alias: entry.alias, points: String(entry.points) })
      } : { cache: "no-store" };
      const response = await fetch(rankingUrl, options);
      if (!response.ok) throw new Error("HTTP " + response.status);
      const data = await response.json();
      if (!data.ok || !Array.isArray(data.entries)) throw new Error("Resposta de classificació incorrecta");
      return data.entries;
    }

    async function loadRanking() {
      rankingStatus.textContent = "Carregant la classificació…";
      try {
        const entries = await getRanking();
        renderRanking(entries);
        const scope = rankingUrl ? "Classificació compartida." : "Classificació d’aquest navegador.";
        rankingStatus.textContent = entries.length ? scope : scope + " Encara no hi ha puntuacions.";
      } catch {
        rankingStatus.textContent = "Ara mateix no es pot carregar la classificació.";
      }
    }

    rankingForm.addEventListener("submit", async event => {
      event.preventDefault();
      if (rankingBusy || pendingScore === null) return;
      const alias = rankingAlias.value.trim().normalize("NFC");
      if (!/^[\p{L}\p{N}][\p{L}\p{N} _·-]{1,23}$/u.test(alias)) {
        rankingStatus.textContent = "Escriu un àlies de 2 a 24 caràcters amb lletres, números, espais o guions.";
        rankingAlias.focus();
        return;
      }
      const submission = pendingScore;
      const entry = { alias, points: submission.points };
      rankingBusy = true;
      rankingSave.disabled = true;
      rankingStatus.textContent = "Desant la puntuació…";
      try {
        renderRanking(await getRanking(entry));
        if (pendingScore === submission) {
          pendingScore = null;
          rankingForm.hidden = true;
        }
        rankingStatus.textContent = "S’ha desat la millor puntuació d’aquest àlies.";
      } catch {
        rankingStatus.textContent = "No s’ha pogut desar la puntuació. Torna-ho a provar.";
      } finally {
        rankingBusy = false;
        rankingSave.disabled = false;
      }
    });

    function nameOf(code) {
      return code === "XK" ? "Kosovo" : regionNames.of(code);
    }

    function countryCode(properties) {
      if (/^[A-Z]{2}$/.test(properties.ISO_A2 ?? "")) return properties.ISO_A2;
      const special = { France: "FR", Norway: "NO", Kosovo: "XK" };
      return special[properties.ADMIN] || null;
    }

    function showWorld() {
      map.stop();
      map.fitBounds([[-58, -180], [84, 180]], {
        padding: [12, 12],
        animate: false
      });
    }

    function availableCountries(level) {
      return level.codes.split(" ").filter(code => layers.has(code));
    }

    function chooseCountries(level) {
      const available = availableCountries(level);

      for (let index = available.length - 1; index > 0; index--) {
        const randomIndex = Math.floor(Math.random() * (index + 1));
        [available[index], available[randomIndex]] = [available[randomIndex], available[index]];
      }

      return available.slice(0, questionsPerRound);
    }

    function updateStats() {
      const roundResults = results.slice(roundStart);
      score.textContent = `${results.filter(result => result.hit).length * 100} punts`;
      streakBadge.textContent = `🔥 Ratxa ×${streak}`;
      streakBadge.hidden = streak < 3 || phase === "finished";

      progress.replaceChildren(...questions.map((_, index) => {
        const segment = document.createElement("span");
        const result = roundResults[index];

        if (result) {
          segment.className = result.hit ? "hit" : "miss";
        } else if (phase === "question" && index === questionIndex) {
          segment.className = "current";
        }

        return segment;
      }));
    }

    function showRoundIntro() {
      phase = "intro";
      questions = selections[levelIndex];
      questionIndex = 0;
      roundStart = results.length;

      const number = levelIndex + 1;
      const label = reviewing ? `Bloc de repàs ${number}` : `Ronda ${number}`;
      const description = reviewing ? "Països pendents" : levels[levelIndex].name;
      const count = questions.length === 1 ? "1 pregunta" : `${questions.length} preguntes`;

      levelLabel.textContent = `${label}/${selections.length} · ${description}`;
      question.textContent = "A punt per començar?";
      counter.textContent = "";
      feedback.textContent = "";
      skip.hidden = true;
      continueButton.hidden = true;
      review.hidden = true;
      updateStats();

      introTitle.textContent = label;
      introInfo.textContent = `${description} · ${count}`;
      intro.showModal();
    }

    function showQuestion() {
      phase = "question";
      effects.clearLayers();
      countries.setStyle(land);
      showWorld();

      const country = document.createElement("strong");
      country.textContent = nameOf(questions[questionIndex]);
      question.replaceChildren("Troba al mapa · ", country);

      counter.textContent = `Pregunta ${questionIndex + 1}/${questions.length}`;
      feedback.textContent = "Clica el país. Pots arrossegar el mapa i fer zoom amb la roda.";
      skip.hidden = false;
      continueButton.hidden = true;
      updateStats();
    }

    function clearConfetti() {
      clearTimeout(confettiTimer);
      confetti.replaceChildren();
    }

    function startSession(missedCountries = null) {
      pendingScore = null;
      rankingForm.hidden = true;
      clearTimeout(answerTimer);
      clearConfetti();
      pins.clearLayers();
      effects.clearLayers();
      countries.setStyle(land);
      showWorld();

      results = [];
      streak = 0;
      levelIndex = 0;
      reviewing = Boolean(missedCountries);

      if (reviewing) {
        selections = [];
        for (let index = 0; index < missedCountries.length; index += questionsPerRound) {
          selections.push(missedCountries.slice(index, index + questionsPerRound));
        }
      } else {
        selections = levels.map(chooseCountries);
      }

      showRoundIntro();
    }

    function addPin(position, hit) {
      const animation = hit ? "pin-land" : "pin-slip";
      const icon = L.divIcon({
        className: "",
        html: `<span class="pin ${animation}" aria-hidden="true"></span>`,
        iconSize: [28, 34],
        iconAnchor: [14, 32]
      });

      return L.marker(position, {
        icon,
        interactive: false,
        keyboard: false,
        zIndexOffset: hit ? 0 : 1000
      }).addTo(hit ? pins : effects);
    }

    function addPoints(position) {
      const icon = L.divIcon({
        className: "",
        html: '<span class="points" aria-hidden="true">+100</span>',
        iconSize: [84, 24],
        iconAnchor: [42, 53]
      });

      L.marker(position, {
        icon,
        interactive: false,
        keyboard: false,
        zIndexOffset: 1000
      }).addTo(effects);
    }

    function mainBounds(layer) {
      const geometry = layer.feature.geometry;
      if (geometry.type !== "MultiPolygon") return layer.getBounds();

      let largest = geometry.coordinates[0][0];
      let largestArea = -1;

      for (const [ring] of geometry.coordinates) {
        let twiceArea = 0;

        for (let index = 1; index < ring.length; index++) {
          const [x1, y1] = ring[index - 1];
          const [x2, y2] = ring[index];
          twiceArea += x1 * y2 - y1 * x2;
        }

        const area = Math.abs(twiceArea);
        if (area > largestArea) {
          largestArea = area;
          largest = ring;
        }
      }

      return L.latLngBounds(largest.map(([longitude, latitude]) => [latitude, longitude]));
    }

    function reveal(target, position) {
      target.setStyle(correct).bringToFront();

      const targetBounds = mainBounds(target);
      const bounds = L.latLngBounds(targetBounds.getSouthWest(), targetBounds.getNorthEast());
      if (position) bounds.extend(position);

      map.stop();
      const options = { padding: [34, 34], maxZoom: 5 };

      if (reducedMotion.matches) {
        map.fitBounds(bounds, { ...options, animate: false });
      } else {
        map.flyToBounds(bounds, { ...options, duration: .85 });
      }
    }

    function advanceQuestion() {
      if (phase !== "answer") return;

      if (questionIndex + 1 === questions.length) {
        finishRound();
      } else {
        questionIndex++;
        showQuestion();
      }
    }

    function answer(layer, code, label, position) {
      if (phase !== "question") return;

      phase = "answer";
      skip.hidden = true;
      countries.setStyle(land);

      const targetCode = questions[questionIndex];
      const target = layers.get(targetCode);
      const targetName = nameOf(targetCode);
      const hit = code === targetCode;

      results.push({ code: targetCode, hit });
      streak = hit ? streak + 1 : 0;
      updateStats();

      if (hit) {
        target.setStyle(correct).bringToFront();
        addPin(position, true);
        addPoints(position);
        feedback.textContent = `Correcte! Has trobat ${targetName}.`;
        answerTimer = setTimeout(advanceQuestion, hitDelay);
        return;
      }

      if (layer) layer.setStyle(wrong);

      function showCorrection() {
        feedback.textContent = layer
          ? `Has clicat ${label}. El país correcte és ${targetName}, en verd al mapa.`
          : `El país correcte és ${targetName}, en verd al mapa.`;

        reveal(target, position);
        answerTimer = setTimeout(advanceQuestion, correctionDelay);
      }

      if (position && !reducedMotion.matches) {
        const missedPin = addPin(position, false);
        feedback.textContent = `Has clicat ${label}.`;

        answerTimer = setTimeout(() => {
          effects.removeLayer(missedPin);
          showCorrection();
        }, fallingPinDelay);
      } else {
        showCorrection();
      }
    }

    function celebrate() {
      if (reducedMotion.matches) return;
      clearConfetti();

      const colors = ["#72f0be", "#ffdf83", "#ff897a", "#9dd8ff", "#d4a6f7"];
      const pieces = document.createDocumentFragment();

      for (let index = 0; index < 48; index++) {
        const piece = document.createElement("i");
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[index % colors.length];
        piece.style.setProperty("--time", `${1.4 + Math.random()}s`);
        piece.style.setProperty("--delay", `${Math.random() * .45}s`);
        piece.style.setProperty("--drift", `${Math.random() * 130 - 65}px`);
        pieces.append(piece);
      }

      confetti.replaceChildren(pieces);
      confettiTimer = setTimeout(clearConfetti, 3000);
    }

    function finishRound() {
      clearTimeout(answerTimer);
      effects.clearLayers();
      countries.setStyle(land);
      showWorld();

      for (const result of results) {
        if (result.hit) layers.get(result.code).setStyle(correct);
      }

      const roundHits = results.slice(roundStart).filter(result => result.hit).length;
      const hasNextRound = levelIndex + 1 < selections.length;

      if (hasNextRound) {
        phase = "round-end";
        question.textContent = reviewing ? "Bloc completat!" : "Ronda completada!";
        counter.textContent = `${roundHits} de ${questions.length} encerts`;
        feedback.textContent = reviewing
          ? "Continua amb els països pendents del repàs."
          : `Nivell següent: ${levels[levelIndex + 1].name.toLowerCase()}. Conserves els punts i les xinxetes.`;
        continueButton.textContent = reviewing ? "Bloc següent" : "Ronda següent";
      } else {
        phase = "finished";
        if (!reviewing) {
          pendingScore = { points: results.filter(result => result.hit).length * 100 };
          rankingForm.hidden = false;
        }
        const hits = results.filter(result => result.hit).length;
        const perfect = hits === results.length;

        question.textContent = perfect
          ? "Ple d’encerts!"
          : reviewing ? "Repàs completat!" : "Partida acabada!";

        counter.textContent = `${hits} de ${results.length} encerts`;
        feedback.textContent = hits
          ? "Cada xinxeta clavada al mapa marca un encert."
          : "Pots tornar a buscar els països amb el botó de repàs.";

        review.hidden = perfect;
        continueButton.textContent = "Nova partida";
      }

      continueButton.hidden = false;
      updateStats();

      if (roundHits === questions.length) celebrate();
    }

    intro.addEventListener("cancel", event => event.preventDefault());

    startRoundButton.addEventListener("click", () => {
      if (phase !== "intro") return;
      intro.close();
      showQuestion();
      question.focus({ preventScroll: true });
    });

    world.addEventListener("click", showWorld);
    skip.addEventListener("click", () => answer(null, null, "", null));

    continueButton.addEventListener("click", () => {
      if (phase === "finished") {
        startSession();
      } else if (phase === "round-end") {
        clearConfetti();
        levelIndex++;
        showRoundIntro();
      }
    });

    review.addEventListener("click", () => {
      if (phase !== "finished") return;
      const missed = results.filter(result => !result.hit).map(result => result.code);
      if (missed.length) startSession(missed);
    });

    async function load() {
      try {
        if (!window.L) throw new Error("Leaflet no s’ha carregat.");

        map = L.map("map", {
          scrollWheelZoom: true,
          zoomSnap: .25,
          maxZoom: 8,
          attributionControl: false
        });

        map.zoomControl.getContainer().setAttribute("aria-label", "Controls de zoom");

        L.control.attribution({ prefix: false }).addTo(map).addAttribution(
          '<a href="https://www.naturalearthdata.com/">Natural Earth</a> · ' +
          '<a href="https://leafletjs.com/">Leaflet</a>'
        );

        showWorld();
        pins = L.layerGroup().addTo(map);
        effects = L.layerGroup().addTo(map);

        const response = await fetch(mapUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        countries = L.geoJSON(await response.json(), {
          filter: feature => feature.properties.ADMIN !== "Antarctica",
          style: land,
          onEachFeature(feature, layer) {
            const properties = feature.properties;
            const code = countryCode(properties);
            const label = code ? nameOf(code) : properties.NAME;

            if (code) layers.set(code, layer);

            layer.on({
              mouseover() {
                if (phase === "question") layer.setStyle(hover);
              },
              mouseout() {
                if (phase === "question") layer.setStyle(land);
              },
              click(event) {
                answer(layer, code, label, event.latlng);
              }
            });
          }
        }).addTo(map);

        for (const level of levels) {
          if (availableCountries(level).length < questionsPerRound) {
            throw new Error(`No hi ha prou països al nivell ${level.name}.`);
          }
        }

        world.hidden = false;
        startSession();
      } catch (error) {
        question.textContent = "No s’ha pogut preparar la partida";
        feedback.textContent = "Torna a carregar la pàgina per provar-ho de nou.";
        console.error(error);
      }
    }

    load();
    loadRanking();
  </script>
</body>
</html>
