<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>On és aquest país? · MADUKA</title>
  <link rel="icon" href="../favicon.png?v=2">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      background: #081421;
      color: #f2f7fb;
      font: 16px/1.5 system-ui, sans-serif;
    }

    main {
      max-width: 1320px;
      margin: auto;
      padding: 20px clamp(12px, 3vw, 36px) 28px;
    }

    header, .round, .controls, .stats {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 18px;
    }

    header, .round { justify-content: space-between; }
    header { margin-bottom: 18px; }
    header a { color: #bfd6e9; text-decoration: none; }
    .brand { color: white; font-weight: 850; }
    h1 { margin: 0 0 14px; font-size: clamp(25px, 4vw, 42px); }
    h2 { margin: 0; font-size: clamp(20px, 4vw, 32px); line-height: 1.15; }
    h2 strong, #score { color: #72f0be; }

    .game {
      overflow: hidden;
      border: 1px solid #304a60;
      border-radius: 20px;
      background: #101f30;
    }

    .round, .controls { padding: 12px 16px; }
    .level { margin: 0 0 5px; color: #b3d6f2; font-size: .85rem; font-weight: 700; }
    #counter { color: #bed0df; font-size: .9rem; }

    #streak {
      padding: 3px 9px;
      border-radius: 999px;
      background: #68471f;
      color: #fff1af;
      font-size: .85rem;
      font-weight: 800;
    }

    .progress { display: flex; gap: 5px; padding: 0 16px 10px; }
    .progress span { flex: 1; height: 5px; border-radius: 6px; background: #30455a; }
    .progress .current { background: #91c8f3; }
    .progress .hit { background: #36e8a5; }
    .progress .miss { background: #ff8d80; }

    .map-frame { position: relative; isolation: isolate; }

    #map {
      height: clamp(320px, 58vh, 690px);
      background: radial-gradient(ellipse at 50% 38%, #1b4c69, #112f49 72%);
      border-block: 1px solid #304a60;
    }

    path.leaflet-interactive { transition: fill .14s ease, stroke .14s ease; }
    .leaflet-container .leaflet-control-attribution { background: #101f30; color: #d0e1ed; }
    .leaflet-control-attribution a { color: #9dd8ff; }
    #feedback { flex: 1 1 250px; margin: 0; color: #d4e4ef; }

    button {
      min-height: 40px;
      padding: 7px 12px;
      border: 1px solid #46637a;
      border-radius: 10px;
      background: #1c3349;
      color: #f4f9fc;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.15); }
    .primary { background: #72f0be; color: #08251d; border-color: #72f0be; }
    :focus-visible { outline: 3px solid #a6e0ff; outline-offset: 3px; }

    .pin {
      position: relative;
      display: block;
      width: 28px;
      height: 34px;
      transform-origin: 14px 32px;
      filter: drop-shadow(2px 3px 2px #001827aa);
    }

    .pin::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 10px;
      width: 4px;
      height: 22px;
      background: linear-gradient(90deg, #56636e, #f5fbff 55%, #9ca9b2);
      clip-path: polygon(0 0, 100% 0, 100% 84%, 50% 100%, 0 84%);
    }

    .pin::after {
      content: "";
      position: absolute;
      top: 1px;
      left: 4px;
      width: 20px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 28%,
        #fff4db, #ff987c 23%, #ed4637 54%, #a21924);
      box-shadow: inset 0 -2px 2px #66141e70;
    }

    .pin-land { animation: land .52s ease-out both; }
    .pin-slip { animation: slip .7s ease-in-out both; }

    .points {
      display: block;
      color: #e3fff2;
      font: 900 24px/1 system-ui, sans-serif;
      text-align: center;
      text-shadow: 0 2px 7px #001e17, 0 0 12px #08744c;
      animation: float-up 1.15s .33s ease-out both;
    }

    #confetti { position: absolute; z-index: 450; inset: 0; overflow: hidden; pointer-events: none; }

    #confetti i {
      position: absolute;
      top: -18px;
      width: 9px;
      height: 15px;
      border-radius: 2px;
      animation: fall var(--time) var(--delay) ease-in both;
    }

    @keyframes land {
      0% { transform: translateY(-44px) rotate(-14deg); opacity: 0; }
      64% { transform: translateY(0); opacity: 1; }
      80% { transform: translateY(-5px); }
      100% { transform: translateY(0); opacity: 1; }
    }

    @keyframes slip {
      0% { transform: translateY(-44px) rotate(-14deg); opacity: 0; }
      42% { transform: translateY(0); opacity: 1; }
      68% { transform: translate(8px, -7px) rotate(65deg); opacity: 1; }
      100% { transform: translate(28px, 80px) rotate(145deg); opacity: 0; }
    }

    @keyframes float-up {
      0% { transform: scale(.75); opacity: 0; }
      20%, 70% { opacity: 1; }
      100% { transform: translateY(-55px) scale(1.12); opacity: 0; }
    }

    @keyframes fall {
      to { transform: translate(var(--drift), 75vh) rotate(640deg); opacity: .2; }
    }

    @media (prefers-reduced-motion: reduce) {
      .pin, .points, #confetti i { animation: none; }
      path.leaflet-interactive { transition: none; }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <a class="brand" href="../">MADUKA</a>
      <a href="./">← Geografia</a>
    </header>

    <h1>On és aquest país?</h1>

    <section class="game" aria-label="Joc del mapamundi">
      <div class="round">
        <div>
          <p id="level" class="level"></p>
          <h2 id="question" aria-live="polite">Preparant el mapa…</h2>
        </div>
        <div class="stats">
          <span id="counter"></span>
          <strong id="score"></strong>
          <span id="streak" hidden></span>
        </div>
      </div>

      <div id="progress" class="progress" aria-hidden="true"></div>

      <div class="map-frame">
        <div id="map" role="region" aria-label="Mapamundi interactiu"></div>
        <div id="confetti" aria-hidden="true"></div>
      </div>

      <div class="controls">
        <p id="feedback" role="status">Carregant les fronteres dels països…</p>
        <button id="world" type="button" hidden>Vista del món</button>
        <button id="skip" type="button" hidden>Passa</button>
        <button id="review" type="button" hidden>Repassem els errors</button>
        <button id="next" class="primary" type="button" hidden>Següent</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const mapUrl = "https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson/ne_110m_admin_0_countries.geojson";
    const questionsPerRound = 10;

    const levels = [
      { name: "Fàcil", codes: "CA US BR RU CN IN AU MX AR ES FR GB JP DE EG IT" },
      { name: "Mitjana", codes: "PT NO SE FI PL GR TR MA DZ ZA PE CO CL ID SA NZ TH UA" },
      { name: "Difícil", codes: "IE RO BG HU AT CH BE NL DK CZ SK CU VN KR LK NP EC UY TN JO" },
      { name: "Experta", codes: "ME XK SI AL MK MD BA EE LV LT LU BN BT TL QA KW GQ GM SV" }
    ];

    const levelLabel = document.getElementById("level");
    const question = document.getElementById("question");
    const counter = document.getElementById("counter");
    const score = document.getElementById("score");
    const streakBadge = document.getElementById("streak");
    const progress = document.getElementById("progress");
    const feedback = document.getElementById("feedback");
    const world = document.getElementById("world");
    const skip = document.getElementById("skip");
    const review = document.getElementById("review");
    const next = document.getElementById("next");
    const confetti = document.getElementById("confetti");

    const regionNames = new Intl.DisplayNames(["ca"], { type: "region" });
    const reducedMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const layers = new Map();
    const land = { color: "#52766f", weight: .8, fillColor: "#c8dbbc", fillOpacity: 1 };
    const hover = { color: "#f6bb4c", weight: 1.4, fillColor: "#ffdf83" };
    const correct = { color: "#e5fff3", weight: 2, fillColor: "#31eba4" };
    const wrong = { color: "#ffe1db", weight: 1.8, fillColor: "#ff897a" };

    let map, countries, pins, effects;
    let selections = [];
    let levelIndex = 0;
    let questions = [];
    let questionIndex = 0;
    let results = [];
    let roundStart = 0;
    let streak = 0;
    let phase = "loading";
    let reviewing = false;
    let confettiTimer;

    function nameOf(code) {
      return code === "XK" ? "Kosovo" : regionNames.of(code);
    }

    function countryCode(properties) {
      const special = { France: "FR", Norway: "NO", Kosovo: "XK" };
      if (/^[A-Z]{2}$/.test(properties.ISO_A2 ?? "")) return properties.ISO_A2;
      return special[properties.ADMIN] || null;
    }

    function showWorld() {
      map.stop();
      map.fitBounds([[-58, -180], [84, 180]], {
        padding: [12, 12],
        animate: false
      });
    }

    function chooseCountries(level) {
      const available = level.codes.split(" ").filter(code => layers.has(code));

      for (let i = available.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [available[i], available[j]] = [available[j], available[i]];
      }

      return available.slice(0, questionsPerRound);
    }

    function updateStats() {
      const roundResults = results.slice(roundStart);
      score.textContent = `${results.filter(result => result.hit).length * 100} punts`;
      streakBadge.textContent = `🔥 Ratxa ×${streak}`;
      streakBadge.hidden = streak < 3 || phase === "finished";

      progress.replaceChildren(...questions.map((_, index) => {
        const segment = document.createElement("span");
        const result = roundResults[index];

        if (result) {
          segment.className = result.hit ? "hit" : "miss";
        } else if (index === questionIndex) {
          segment.className = "current";
        }

        return segment;
      }));
    }

    function showQuestion() {
      phase = "question";
      effects.clearLayers();
      countries.setStyle(land);
      showWorld();

      const name = document.createElement("strong");
      name.textContent = nameOf(questions[questionIndex]);
      question.replaceChildren("Troba al mapa · ", name);
      counter.textContent = `Pregunta ${questionIndex + 1}/${questions.length}`;
      feedback.textContent = "Clica el país. Pots arrossegar el mapa i fer zoom amb la roda.";
      skip.hidden = false;
      next.hidden = true;
      updateStats();
    }

    function startRound() {
      questions = selections[levelIndex];
      questionIndex = 0;
      roundStart = results.length;
      levelLabel.textContent =
        `Ronda ${levelIndex + 1}/${levels.length} · ${levels[levelIndex].name}`;
      showQuestion();
    }

    function startSession(missedCountries = null) {
      clearTimeout(confettiTimer);
      confetti.replaceChildren();
      pins.clearLayers();
      results = [];
      roundStart = 0;
      streak = 0;
      levelIndex = 0;
      review.hidden = true;
      reviewing = Boolean(missedCountries);

      if (reviewing) {
        selections = [];
        for (let i = 0; i < missedCountries.length; i += questionsPerRound) {
          selections.push(missedCountries.slice(i, i + questionsPerRound));
        }
        startReviewRound();
        return;
      }

      selections = levels.map(chooseCountries);
      startRound();
    }

    function startReviewRound() {
      questions = selections[levelIndex];
      questionIndex = 0;
      roundStart = results.length;
      levelLabel.textContent = `Repàs · Bloc ${levelIndex + 1}/${selections.length}`;
      showQuestion();
    }

    function addPin(position, hit) {
      const icon = L.divIcon({
        className: "",
        html: `<span class="pin ${hit ? "pin-land" : "pin-slip"}" aria-hidden="true"></span>`,
        iconSize: [28, 34],
        iconAnchor: [14, 32]
      });

      return L.marker(position, {
        icon,
        interactive: false,
        keyboard: false,
        zIndexOffset: hit ? 0 : 1000
      }).addTo(hit ? pins : effects);
    }

    function addPoints(position) {
      const icon = L.divIcon({
        className: "",
        html: '<span class="points" aria-hidden="true">+100</span>',
        iconSize: [84, 24],
        iconAnchor: [42, 53]
      });

      const marker = L.marker(position, {
        icon,
        interactive: false,
        keyboard: false,
        zIndexOffset: 1000
      }).addTo(effects);

      setTimeout(() => effects.removeLayer(marker), 1550);
    }

    // Per als països amb territoris dispersos, centra la vista en el polígon principal.
    function mainBounds(layer) {
      const geometry = layer.feature.geometry;
      if (geometry.type !== "MultiPolygon") return layer.getBounds();

      let largest = geometry.coordinates[0][0];
      let largestArea = -1;

      for (const [ring] of geometry.coordinates) {
        let twiceArea = 0;

        for (let i = 1; i < ring.length; i++) {
          const [x1, y1] = ring[i - 1];
          const [x2, y2] = ring[i];
          twiceArea += x1 * y2 - y1 * x2;
        }

        const area = Math.abs(twiceArea);
        if (area > largestArea) {
          largestArea = area;
          largest = ring;
        }
      }

      return L.latLngBounds(largest.map(([lng, lat]) => [lat, lng]));
    }

    function reveal(target, position) {
      target.setStyle(correct).bringToFront();

      const bounds = L.latLngBounds(
        mainBounds(target).getSouthWest(),
        mainBounds(target).getNorthEast()
      );
      if (position) bounds.extend(position);

      map.stop();
      const options = { padding: [34, 34], maxZoom: 5 };

      if (reducedMotion.matches) {
        map.fitBounds(bounds, { ...options, animate: false });
      } else {
        map.flyToBounds(bounds, { ...options, duration: .85 });
      }
    }

    function showNextButton() {
      next.textContent = questionIndex + 1 === questions.length
        ? "Veure resultat"
        : "Següent";
      next.hidden = false;
    }

    function answer(layer, code, label, position) {
      if (phase !== "question") return;

      phase = "answer";
      skip.hidden = true;
      countries.setStyle(land);

      const targetCode = questions[questionIndex];
      const target = layers.get(targetCode);
      const targetName = nameOf(targetCode);
      const hit = code === targetCode;

      results.push({ code: targetCode, hit });
      streak = hit ? streak + 1 : 0;
      updateStats();

      if (hit) {
        target.setStyle(correct).bringToFront();
        addPin(position, true);
        addPoints(position);
        feedback.textContent = `Correcte! Has trobat ${targetName}.`;
        showNextButton();
        return;
      }

      if (layer) layer.setStyle(wrong);

      function showCorrection() {
        feedback.textContent = layer
          ? `Has clicat ${label}. En verd tens la resposta: ${targetName}.`
          : `En verd tens la resposta: ${targetName}.`;
        reveal(target, position);
        showNextButton();
      }

      if (position && !reducedMotion.matches) {
        const missedPin = addPin(position, false);
        feedback.textContent = `Has clicat ${label}.`;

        setTimeout(() => {
          effects.removeLayer(missedPin);
          showCorrection();
        }, 700);
      } else {
        showCorrection();
      }
    }

    function showMapResults() {
      effects.clearLayers();
      countries.setStyle(land);
      showWorld();

      for (const result of results) {
        if (result.hit) layers.get(result.code).setStyle(correct);
      }
    }

    function celebrate() {
      if (reducedMotion.matches) return;

      clearTimeout(confettiTimer);
      const colors = ["#72f0be", "#ffdf83", "#ff897a", "#9dd8ff", "#d4a6f7"];
      const pieces = document.createDocumentFragment();

      for (let i = 0; i < 48; i++) {
        const piece = document.createElement("i");
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.background = colors[i % colors.length];
        piece.style.setProperty("--time", `${1.4 + Math.random()}s`);
        piece.style.setProperty("--delay", `${Math.random() * .45}s`);
        piece.style.setProperty("--drift", `${Math.random() * 130 - 65}px`);
        pieces.append(piece);
      }

      confetti.replaceChildren(pieces);
      confettiTimer = setTimeout(() => confetti.replaceChildren(), 3000);
    }

    function finishRound() {
      showMapResults();

      const roundHits = results.slice(roundStart).filter(result => result.hit).length;
      const hasNextRound = levelIndex + 1 < selections.length;

      if (hasNextRound) {
        phase = "round-end";
        question.textContent = reviewing ? "Bloc completat!" : "Ronda completada!";
        counter.textContent = `${roundHits} de ${questions.length} encerts`;
        feedback.textContent = reviewing
          ? "Segueix amb els països pendents del repàs."
          : `Ara ve el nivell ${levels[levelIndex + 1].name.toLowerCase()}. Conserves els punts i les xinxetes.`;
        next.textContent = reviewing ? "Bloc següent" : "Ronda següent";
      } else {
        phase = "finished";
        const hits = results.filter(result => result.hit).length;
        const perfect = hits === results.length;
        question.textContent = perfect
          ? "Ple d’encerts!"
          : reviewing ? "Repàs completat!" : "Partida acabada!";
        counter.textContent = `${hits} de ${results.length} encerts`;
        feedback.textContent = hits
          ? `Les xinxetes del mapa marquen els teus encerts: ${hits}.`
          : "Pots tornar a buscar els països amb el botó de repàs.";
        review.hidden = perfect;
        next.textContent = "Nova partida";
        updateStats();
      }

      if (roundHits === questions.length) celebrate();
    }

    world.addEventListener("click", showWorld);
    skip.addEventListener("click", () => answer(null, null, "", null));

    next.addEventListener("click", () => {
      if (next.hidden) return;

      if (phase === "finished") {
        startSession();
      } else if (phase === "round-end") {
        clearTimeout(confettiTimer);
        confetti.replaceChildren();
        levelIndex++;
        if (reviewing) startReviewRound();
        else startRound();
      } else if (phase === "answer") {
        if (questionIndex + 1 === questions.length) {
          finishRound();
        } else {
          questionIndex++;
          showQuestion();
        }
      }
    });

    review.addEventListener("click", () => {
      const missed = results.filter(result => !result.hit).map(result => result.code);
      if (missed.length) startSession(missed);
    });

    async function load() {
      try {
        if (!window.L) throw new Error("Leaflet no s’ha carregat.");

        map = L.map("map", {
          scrollWheelZoom: true,
          zoomSnap: .25,
          maxZoom: 8,
          attributionControl: false
        });

        map.zoomControl.getContainer().setAttribute("aria-label", "Controls de zoom");
        L.control.attribution({ prefix: false }).addTo(map).addAttribution(
          '<a href="https://www.naturalearthdata.com/">Natural Earth</a> · ' +
          '<a href="https://leafletjs.com/">Leaflet</a>'
        );

        showWorld();
        pins = L.layerGroup().addTo(map);
        effects = L.layerGroup().addTo(map);

        const response = await fetch(mapUrl);
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        countries = L.geoJSON(await response.json(), {
          filter: feature => feature.properties.ADMIN !== "Antarctica",
          style: land,
          onEachFeature(feature, layer) {
            const properties = feature.properties;
            const code = countryCode(properties);
            const label = code ? nameOf(code) : properties.NAME;

            if (code) layers.set(code, layer);

            layer.on({
              mouseover() {
                if (phase === "question") layer.setStyle(hover);
              },
              mouseout() {
                if (phase === "question") layer.setStyle(land);
              },
              click(event) {
                answer(layer, code, label, event.latlng);
              }
            });
          }
        }).addTo(map);

        for (const level of levels) {
          const count = level.codes.split(" ").filter(code => layers.has(code)).length;
          if (count < questionsPerRound) {
            throw new Error(`No hi ha prou països al nivell ${level.name}.`);
          }
        }

        world.hidden = false;
        startSession();
      } catch (error) {
        question.textContent = "No s’ha pogut preparar la partida";
        feedback.textContent = "Torna a carregar la pàgina per provar-ho de nou.";
        console.error(error);
      }
    }

    load();
  </script>
</body>
</html>
