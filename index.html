<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MADUKA</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f5;
      color: #1d1d1f;
      line-height: 1.5;
    }

    /* CAPÇALERA */

    header {
      max-width: 1200px;
      margin: auto;
      padding: 35px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
    }

    nav a {
      color: #555;
      text-decoration: none;
      margin-left: 30px;
      font-size: 15px;
    }

    nav a:hover {
      color: #000;
    }

    /* PRESENTACIÓ */

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 100px 30px 90px;
    }

    .hero h1 {
      font-size: clamp(52px, 8vw, 100px);
      line-height: 0.95;
      letter-spacing: -5px;
      max-width: 950px;
    }

    .hero p {
      margin-top: 35px;
      font-size: 21px;
      color: #666;
      max-width: 650px;
    }

    /* RECURSOS */

    .recursos {
      max-width: 1200px;
      margin: auto;
      padding: 40px 30px 100px;
    }

    .recursos h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
      color: #777;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 35px;
      min-height: 240px;
      text-decoration: none;
      color: inherit;

      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;

      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0,0,0,0.08);
    }

    .icon {
      font-size: 35px;
    }

    .card h3 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .card p {
      color: #777;
      font-size: 14px;
    }

    /* PEU */

    footer {
      max-width: 1200px;
      margin: auto;
      padding: 40px 30px;
      border-top: 1px solid #ddd;
      color: #888;
      font-size: 13px;
    }

    /* MÒBIL */

    @media (max-width: 800px) {

      .grid {
        grid-template-columns: 1fr;
      }

      .hero {
        padding-top: 60px;
      }

      .hero h1 {
        letter-spacing: -3px;
      }

      nav {
        display: none;
      }
    }

  </style>
</head>


<body>

<header>

  <div class="logo">
    MADUKA
  </div>

</header>


<main>

  <!-- PRESENTACIÓ -->

  <section class="hero">

    <h1>
      Aprendre.<br>
      Experimentar.<br>
      Crear.
    </h1>

    <p>
      Laboratori de recursos digitals per a l'aula.
      Activitats interactives, jocs i eines per aprendre
      experimentant.
    </p>

  </section>


  <!-- RECURSOS -->

  <section class="recursos" id="recursos">

    <h2>Explora els recursos</h2>

    <div class="grid">

      <!-- MATEMÀTIQUES -->

      <a class="card" href="matematiques/">

        <div class="icon">
          🎲
        </div>

        <div>
          <h3>Matemàtiques</h3>

          <p>
            Jocs, simuladors i activitats interactives.
          </p>
        </div>

      </a>

    </div>

  </section>

</main>


<footer>
  MADUKA · Recursos educatius oberts
</footer>


</body>
</html>
