<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Matemàtiques · MADUKA LAB</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f5;
      color: #1d1d1f;
      line-height: 1.5;
    }

    header {
      max-width: 1200px;
      margin: auto;
      padding: 35px 30px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      text-decoration: none;
      color: #1d1d1f;
    }

    .tornar {
      color: #555;
      text-decoration: none;
      font-size: 15px;
    }

    .tornar:hover {
      color: #000;
    }

    .hero {
      max-width: 1200px;
      margin: auto;
      padding: 100px 30px 90px;
    }

    .hero h1 {
      font-size: clamp(52px, 8vw, 100px);
      line-height: 0.95;
      letter-spacing: -5px;
    }

    .hero p {
      margin-top: 35px;
      font-size: 21px;
      color: #666;
      max-width: 650px;
    }

    .recursos {
      max-width: 1200px;
      margin: auto;
      padding: 40px 30px 100px;
    }

    .recursos h2 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
      color: #777;
    }

    .buit {
      background: white;
      border-radius: 18px;
      padding: 50px 35px;
      color: #777;
      max-width: 600px;
    }

    footer {
      max-width: 1200px;
      margin: auto;
      padding: 40px 30px;
      border-top: 1px solid #ddd;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 800px) {

      .hero {
        padding-top: 60px;
      }

      .hero h1 {
        letter-spacing: -3px;
      }
    }
  </style>
</head>

<body>

<header>

  <a class="logo" href="../">
    MADUKA LAB
  </a>

  <a class="tornar" href="../">
    ← Inici
  </a>

</header>


<main>

  <section class="hero">

    <h1>
      Matemàtiques.
    </h1>

    <p>
      Jocs, simuladors i activitats interactives
      per experimentar amb les matemàtiques.
    </p>

  </section>


  <section class="recursos">

    <h2>Recursos</h2>

    <div class="buit">
      Aviat hi trobaràs nous recursos.
    </div>

  </section>

</main>


<footer>
  MADUKA LAB · Recursos educatius oberts
</footer>

</body>
</html>
