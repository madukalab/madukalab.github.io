<!DOCTYPE html>
<html lang="ca">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MADUKA</title>

  <link rel="icon" type="image/png" href="./favicon.png?v=2">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f7f7f5;
      color: #1d1d1f;
      line-height: 1.5;
    }

    header {
      max-width: 1200px;
      margin: auto;
      padding: 35px 30px;
      display: flex;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -1px;
      text-decoration: none;
      color: #1d1d1f;
    }

    .recursos {
      max-width: 1200px;
      margin: auto;
      padding: 12px 30px 100px;
    }

    .recursos h1 {
      font-size: 14px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 30px;
      color: #777;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 35px;
      min-height: 240px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.08);
    }

    .icon {
      font-size: 35px;
    }

    .card h2 {
      font-size: 24px;
      margin-bottom: 5px;
    }

    .card p {
      color: #777;
      font-size: 14px;
    }

    footer {
      max-width: 1200px;
      margin: auto;
      padding: 40px 30px;
      border-top: 1px solid #ddd;
      color: #888;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <header>
    <a class="logo" href="./index.html" aria-label="Torna a l’inici de MADUKA">
      MADUKA
    </a>
  </header>

  <main>
    <section class="recursos" id="recursos">
      <h1>Explora els recursos</h1>

      <div class="grid">
        <a class="card" href="matematiques/">
          <div class="icon" aria-hidden="true">🎲</div>

          <div>
            <h2>Matemàtiques</h2>
            <p>Jocs, simuladors i activitats interactives.</p>
          </div>
        </a>

        <a class="card" href="geografia/">
          <div class="icon" aria-hidden="true">🌍</div>

          <div>
            <h2>Geografia</h2>
            <p>Posa a prova el que saps de geografia.</p>
          </div>
        </a>
      </div>
    </section>
  </main>

  <footer>
    MADUKA · Recursos educatius oberts
  </footer>
</body>

</html>
